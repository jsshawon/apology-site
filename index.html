<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Sorry, Afifa</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease;
      z-index: 2;
    }

    h1 { color: #ff4d6d; font-size: 28px; }

    .animated-name {
      font-size: 26px;
      font-weight: bold;
      color: #ff4d6d;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #ff4d6d; }
      to { text-shadow: 0 0 20px #ff4d6d; }
    }

    p { font-size: 18px; line-height: 1.6; min-height: 180px; }

    button {
      margin: 10px; padding: 10px 20px; border: none; border-radius: 25px;
      background: #ff4d6d; color: white; font-size: 16px; cursor: pointer; transition: 0.3s;
    }

    button:hover { background: #e63950; transform: scale(1.05); }

    #noBtn { position: relative; }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);} 
      to {opacity: 1; transform: translateY(0);} 
    }

    .heart {
      position: absolute; color: red; animation: floatUp 5s linear infinite;
      font-size: 20px; z-index: 1;
    }

    @keyframes floatUp {
      from {transform: translateY(100vh); opacity: 1;} 
      to {transform: translateY(-10vh); opacity: 0;} 
    }
  </style>
</head>
<body>

<!-- Use your uploaded file: music.mp3 in the same repo folder -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>I'm Truly Sorry,</h1>
  <div class="animated-name">Afifa Miaimuna Zaima</div>

  <p id="typedText"></p>

  <div id="buttons" style="display:none;">
    <p>Do you forgive me?</p>
    <button onclick="yesClicked()">Yes 💖</button>
    <button id="noBtn" onmouseover="moveNo()">No 😢</button>
  </div>

  <p id="response"></p>
</div>

<script>
// Start music after first tap/click (mobile-safe)
document.body.addEventListener('click', () => {
  const music = document.getElementById('bgMusic');
  if (music.paused) music.play();
}, { once: true });

const text = `Dear Afifa Miaimuna Zaima,\n\nI know I hurt you, and I am truly sorry. It was never my intention to cause you pain, not even unintentionally.\n\nYou mean so much to me, and realizing that I made you feel hurt really affects me deeply.\n\nI promise I will be more careful, more understanding, and better in every way I can.\n\nI respect your feelings and your heart. I just hope one day you can forgive me.`;

let index = 0;

function typeWriter() {
  if (index < text.length) {
    document.getElementById("typedText").innerHTML += text.charAt(index);
    index++;
    setTimeout(typeWriter, 40);
  } else {
    document.getElementById("buttons").style.display = "block";
  }
}

typeWriter();

function yesClicked() {
  document.getElementById('response').innerText = "Thank you... this truly means everything to me ❤️";
}

function moveNo() {
  const btn = document.getElementById('noBtn');
  btn.style.position = 'absolute';
  btn.style.top = Math.random() * 200 + 'px';
  btn.style.left = Math.random() * 200 + 'px';
}

function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerText = '❤';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
  document.body.appendChild(heart);

  setTimeout(() => { heart.remove(); }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
